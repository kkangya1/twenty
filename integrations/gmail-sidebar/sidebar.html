<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Terranova CRM</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <header>
      <div class="brand">T</div>
      <div>
        <h1>Terranova CRM</h1>
        <p id="subtitle"></p>
      </div>
    </header>
    <main>
      <nav>
        <a
          id="dashboard"
          href="http://localhost:3001/objects/dashboards"
          target="_blank"
          rel="noopener noreferrer"
        ></a
        ><a
          id="people"
          href="http://localhost:3001/objects/people"
          target="_blank"
          rel="noopener noreferrer"
        ></a>
      </nav>
      <section class="context">
        <p class="eyebrow" id="context-label"></p>
        <label id="sender-label" for="sender"></label
        ><select id="sender"></select>
        <p id="context-description"></p>
        <div class="actions">
          <button id="use-email" type="button"></button
          ><button id="manual" type="button"></button>
        </div>
      </section>
      <section>
        <h2 id="form-heading"></h2>
        <form id="contact-form">
          <div class="names">
            <label
              ><span id="first-name-label"></span
              ><input
                id="first-name"
                maxlength="100"
                autocomplete="given-name" /></label
            ><label
              ><span id="last-name-label"></span
              ><input id="last-name" maxlength="100" autocomplete="family-name"
            /></label>
          </div>
          <label
            ><span id="email-label"></span
            ><input
              id="email"
              type="email"
              required
              maxlength="254"
              autocomplete="email" /></label
          ><label
            ><span id="job-title-label"></span
            ><input
              id="job-title"
              maxlength="200"
              autocomplete="organization-title" /></label
          ><button id="save" class="primary" type="submit"></button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
        <a
          id="contact-link"
          class="contact-link"
          target="_blank"
          rel="noopener noreferrer"
          hidden
        ></a>
      </section>
    </main>
    <footer id="privacy"></footer>
    <script type="module" src="sidebar.js"></script>
  </body>
</html>
